<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Profile Edit</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function TestProfileEdit() {
            const [isEditing, setIsEditing] = useState(false);
            const [editedData, setEditedData] = useState({
                name: 'Government Officer',
                designation: 'District Agriculture Officer',
                region: 'Punjab - Ludhiana District',
                department: 'Agriculture Department',
                email: 'officer@agri.gov.in',
                phone: '+91-98765-43210'
            });

            const handleEditToggle = () => {
                setIsEditing(!isEditing);
            };

            const handleInputChange = (field, value) => {
                setEditedData(prev => ({
                    ...prev,
                    [field]: value
                }));
            };

            const handleSaveProfile = () => {
                alert('Profile saved successfully!');
                console.log('Saved data:', editedData);
                setIsEditing(false);
            };

            return React.createElement('div', { className: 'min-h-screen bg-gray-50 p-8' }, [
                React.createElement('h1', { className: 'text-2xl font-bold mb-6' }, 'Profile Edit Test'),
                
                React.createElement('div', { className: 'bg-white rounded-lg shadow p-6 max-w-2xl mx-auto' }, [
                    React.createElement('div', { className: 'flex justify-between items-center mb-6' }, [
                        React.createElement('h2', { className: 'text-xl font-semibold' }, 'Profile Information'),
                        React.createElement('button', {
                            onClick: isEditing ? handleSaveProfile : handleEditToggle,
                            className: isEditing ? 
                                'px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700' : 
                                'px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700'
                        }, isEditing ? 'Save Changes' : 'Edit Profile')
                    ]),
                    
                    React.createElement('div', { className: 'grid grid-cols-2 gap-4' }, [
                        React.createElement('div', null, [
                            React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' }, 'Name'),
                            isEditing ? 
                                React.createElement('input', {
                                    type: 'text',
                                    value: editedData.name,
                                    onChange: (e) => handleInputChange('name', e.target.value),
                                    className: 'w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500'
                                }) :
                                React.createElement('div', { className: 'text-gray-900' }, editedData.name)
                        ]),
                        
                        React.createElement('div', null, [
                            React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' }, 'Designation'),
                            isEditing ? 
                                React.createElement('input', {
                                    type: 'text',
                                    value: editedData.designation,
                                    onChange: (e) => handleInputChange('designation', e.target.value),
                                    className: 'w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500'
                                }) :
                                React.createElement('div', { className: 'text-gray-900' }, editedData.designation)
                        ]),
                        
                        React.createElement('div', null, [
                            React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' }, 'Department'),
                            isEditing ? 
                                React.createElement('input', {
                                    type: 'text',
                                    value: editedData.department,
                                    onChange: (e) => handleInputChange('department', e.target.value),
                                    className: 'w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500'
                                }) :
                                React.createElement('div', { className: 'text-gray-900' }, editedData.department)
                        ]),
                        
                        React.createElement('div', null, [
                            React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' }, 'Region'),
                            isEditing ? 
                                React.createElement('input', {
                                    type: 'text',
                                    value: editedData.region,
                                    onChange: (e) => handleInputChange('region', e.target.value),
                                    className: 'w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500'
                                }) :
                                React.createElement('div', { className: 'text-gray-900' }, editedData.region)
                        ]),
                        
                        React.createElement('div', null, [
                            React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' }, 'Email'),
                            isEditing ? 
                                React.createElement('input', {
                                    type: 'email',
                                    value: editedData.email,
                                    onChange: (e) => handleInputChange('email', e.target.value),
                                    className: 'w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500'
                                }) :
                                React.createElement('div', { className: 'text-gray-900' }, editedData.email)
                        ]),
                        
                        React.createElement('div', null, [
                            React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' }, 'Phone'),
                            isEditing ? 
                                React.createElement('input', {
                                    type: 'tel',
                                    value: editedData.phone,
                                    onChange: (e) => handleInputChange('phone', e.target.value),
                                    className: 'w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500'
                                }) :
                                React.createElement('div', { className: 'text-gray-900' }, editedData.phone)
                        ])
                    ])
                ])
            ]);
        }

        ReactDOM.render(React.createElement(TestProfileEdit), document.getElementById('root'));
    </script>
</body>
</html>
