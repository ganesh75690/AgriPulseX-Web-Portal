<!DOCTYPE html>
<html lang="en">
<head>
    <title>Backend Connection Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>AgriPulseX Backend Connection Test</h1>
    <div id="results"></div>
    
    <script>
        async function testConnection() {
            const results = document.getElementById('results');
            
            try {
                // Test basic backend connection
                const response1 = await fetch('http://127.0.0.1:8000/');
                const data1 = await response1.json();
                results.innerHTML += '<p>✅ Basic connection: ' + JSON.stringify(data1) + '</p>';
                
                // Test API info endpoint
                const response2 = await fetch('http://127.0.0.1:8000/api/v2/info');
                const data2 = await response2.json();
                results.innerHTML += '<p>✅ API info: ' + data2.system + ' v' + data2.version + '</p>';
                
                // Test decision endpoint
                const response3 = await fetch('http://127.0.0.1:8000/decision', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        region: 'Punjab',
                        disease: 'Late Blight',
                        severity: 'High',
                        dataConfidence: 87
                    })
                });
                const data3 = await response3.json();
                results.innerHTML += '<p>✅ Decision API: ' + data3.action + ' (Risk: ' + data3.risk + ')</p>';
                
                results.innerHTML += '<h2>✅ All backend connections working properly!</h2>';
                
            } catch (error) {
                results.innerHTML += '<p>❌ Error: ' + error.message + '</p>';
            }
        }
        
        testConnection();
    </script>
</body>
</html>
