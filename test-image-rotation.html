<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Image Rotation</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
        }
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function TestImageRotation() {
            const [currentImageIndex, setCurrentImageIndex] = useState(0);
            const [rotationCount, setRotationCount] = useState(0);
            
            const backgroundImages = [
                '/agri.jpg',
                '/AGRIFIELD.jpg'
            ];

            useEffect(() => {
                // Get stored image index or use 0
                const storedIndex = localStorage.getItem('loginImageIndex');
                const imageIndex = storedIndex ? parseInt(storedIndex) : 0;
                setCurrentImageIndex(imageIndex);
                setRotationCount(imageIndex);
            }, []);

            const rotateImage = () => {
                const nextIndex = (currentImageIndex + 1) % backgroundImages.length;
                setCurrentImageIndex(nextIndex);
                setRotationCount(nextIndex);
                localStorage.setItem('loginImageIndex', nextIndex.toString());
                console.log('Image rotated to:', nextIndex, backgroundImages[nextIndex]);
            };

            const resetRotation = () => {
                setCurrentImageIndex(0);
                setRotationCount(0);
                localStorage.setItem('loginImageIndex', '0');
                console.log('Image rotation reset');
            };

            return React.createElement('div', null, [
                React.createElement('div', {
                    className: 'background-container',
                    style: {
                        backgroundImage: `url("${backgroundImages[currentImageIndex]}")`
                    }
                }),
                React.createElement('div', { className: 'overlay' }),
                React.createElement('div', { className: 'content' }, [
                    React.createElement('div', { 
                        className: 'bg-white rounded-lg shadow-lg p-8 max-w-md w-full mx-4',
                        style: { backgroundColor: 'rgba(255, 255, 255, 0.95)' }
                    }, [
                        React.createElement('h1', { 
                            className: 'text-2xl font-bold text-gray-900 mb-4 text-center' 
                        }, 'Image Rotation Test'),
                        
                        React.createElement('div', { className: 'mb-6 p-4 bg-gray-100 rounded' }, [
                            React.createElement('p', { className: 'text-sm text-gray-700 mb-2' }, [
                                React.createElement('strong', null, 'Current Image: '),
                                backgroundImages[currentImageIndex]
                            ]),
                            React.createElement('p', { className: 'text-sm text-gray-700' }, [
                                React.createElement('strong', null, 'Rotation Count: '),
                                rotationCount
                            ])
                        ]),
                        
                        React.createElement('div', { className: 'space-y-3' }, [
                            React.createElement('button', {
                                onClick: rotateImage,
                                className: 'w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition-colors'
                            }, 'Rotate Image (Simulate Login)'),
                            
                            React.createElement('button', {
                                onClick: resetRotation,
                                className: 'w-full bg-gray-600 text-white py-3 rounded hover:bg-gray-700 transition-colors'
                            }, 'Reset Rotation'),
                            
                            React.createElement('div', { className: 'text-xs text-gray-600 text-center mt-4' }, [
                                'This simulates the login/logout image rotation.',
                                React.createElement('br'),
                                'Click "Rotate Image" to see the background change.'
                            ])
                        ])
                    ])
                ])
            ]);
        }

        ReactDOM.render(React.createElement(TestImageRotation), document.getElementById('root'));
    </script>
</body>
</html>
